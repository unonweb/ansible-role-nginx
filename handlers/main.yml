---
- name: systemctl restart nginx.service
  become: true
  ansible.builtin.systemd_service:
    scope: system
    name: nginx.service
    state: restarted

- name: systemctl reload nginx.service
  become: true
  ansible.builtin.systemd_service:
    scope: system
    name: nginx.service
    state: reloaded

- name: systemctl --system daemon-reload
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: system